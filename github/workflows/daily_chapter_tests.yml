name: Daily 7am WAT Clean Architecture Tests & Email

on:
  schedule:
    # 06:00 UTC = 07:00 a.m. Africa/Lagos (WAT, UTC+1) every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: generate_next_2 (default) or notify_only_day1'
        required: false
        default: 'generate_next_2'

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Next 2 Chapter Tests (60 Questions) & Send Gmail Notification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sa.adeyemi788@gmail.com' }}
          GMAIL_TO: ${{ secrets.GMAIL_TO || 'sa.adeyemi788@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAGES_BASE_URL: https://stefanbtw.github.io/clean-architecture-mastery
        run: |
          if [ "${{ github.event.inputs.mode }}" = "notify_only_day1" ]; then
            python3 scripts/generate_daily_tests.py --notify-only 1 2
          else
            python3 scripts/generate_daily_tests.py
          fi

      - name: Commit and Push Newly Generated Chapter Tests to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tests/ data/tests_manifest.json
          if git diff --staged --quiet; then
            echo "No new test files to commit."
          else
            git commit -m "chore(tests): publish daily 2-chapter Clean Architecture assessments"
            git push origin HEAD:main
          fi
